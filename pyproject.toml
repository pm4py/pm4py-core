[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pm4py"
dynamic = ["version"]
description = "Process mining for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Process Intelligence Solutions (PIS)", email = "info@processintelligence.solutions" },
]
maintainers = [
    { name = "Process Intelligence Solutions (PIS)", email = "info@processintelligence.solutions" },
]
keywords = ["process mining"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "cvxopt; python_version < '3.15'",
    "graphviz",
    "lxml",
    "matplotlib",
    "networkx",
    "numpy",
    "pandas",
    "pytz",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
calendars = ["workalendar"]
connectors = ["requests"]
llm = ["openai", "requests"]
ml = ["pyemd", "scikit-learn"]
ocel = ["jsonschema", "pyarrow"]
polars = ["polars>=1.40.1,<3"]
solvers = ["cvxopt"]
stable = [
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "fonttools==4.63.0",
    "graphviz==0.21",
    "kiwisolver==1.5.0",
    "lxml==6.1.1",
    "matplotlib==3.11.1",
    "networkx==3.6.1",
    "numpy==2.5.1",
    "packaging==26.2",
    "pandas==3.0.5",
    "pillow==12.3.0",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "pytz==2026.3.post1",
    "scipy==1.18.0",
    "setuptools==83.0.0",
    "six==1.17.0",
    "tqdm==4.70.0",
    "wheel==0.47.0",
]
visualization = ["pyvis"]
windows = [
    "pygetwindow; sys_platform == 'win32'",
    "pynput; sys_platform == 'win32'",
    "pywin32; sys_platform == 'win32'",
]
all = [
    "pm4py[calendars,connectors,llm,ml,ocel,polars,solvers,visualization,windows]",
]

[project.urls]
Homepage = "https://processintelligence.solutions/"
Documentation = "https://processintelligence.solutions/pm4py/"
Source = "https://github.com/process-intelligence-solutions/pm4py"
Issues = "https://github.com/process-intelligence-solutions/pm4py/issues"

[dependency-groups]
build = [
    "build",
    "twine",
]
lint = ["flake8"]

[tool.setuptools.dynamic]
version = { attr = "pm4py.meta.__version__" }

[tool.setuptools.packages.find]
include = ["pm4py*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.svg"]
